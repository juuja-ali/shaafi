name: Build ERPNext image

on:
  push:
    branches: [main]
    paths:
      - 'erpnext-build/Dockerfile'
      - 'erpnext-build/apps.json'
      - '.github/workflows/build.yml'
  repository_dispatch:
    types: [app-updated, erpnext-rebuild]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no code changes'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ayoubdahir/shaafi-custom

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CACHE_BUSTER: keyed to apps.json content hash. Only changes when
      # apps.json itself changes (new app, version bump) — every build is a
      # full rebuild otherwise, since there's no per-app fast-update zone.
      - name: Compute apps.json hash (stable cache key)
        id: apps_hash
        run: |
          HASH=$(sha256sum erpnext-build/apps.json | cut -c1-16)
          echo "hash=${HASH}" >> $GITHUB_OUTPUT

      - name: Resolve image tag
        id: build_args
        run: |
          echo "cache_buster=${{ steps.apps_hash.outputs.hash }}" >> $GITHUB_OUTPUT
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        env:
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if timeout 60s bash -lc 'printf "%s" "$GHCR_TOKEN" | docker login "${{ env.REGISTRY }}" -u "$GHCR_USERNAME" --password-stdin'; then
              exit 0
            fi
            [ "$attempt" -lt 5 ] && sleep $((attempt * 15))
          done
          echo "ERROR: docker login failed after 5 attempts"
          exit 1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.build_args.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
            max-parallelism = 2

      - name: Encode apps.json for build
        id: apps
        run: echo "apps_b64=$(base64 -w0 erpnext-build/apps.json)" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./erpnext-build/Dockerfile
          build-args: |
            APPS_JSON_BASE64=${{ steps.apps.outputs.apps_b64 }}
            CACHE_BUSTER=${{ steps.build_args.outputs.cache_buster }}
          secrets: |
            github_token=${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Built image" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.build_args.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Not deployed yet — run the **Deploy to production** workflow with this tag to go live." >> $GITHUB_STEP_SUMMARY
