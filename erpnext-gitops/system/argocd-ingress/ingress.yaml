# Real domain (shaafisystem.com) live as of 2026-07-08, proxied through
# Cloudflare. TLS cert is issued by cert-manager via the letsencrypt-prod
# ClusterIssuer (DNS-01/Cloudflare). ssl-redirect stays "false" until
# Cloudflare's SSL/TLS mode is confirmed as Full/Full-strict on their side —
# see the domain-cutover notes for why.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "argocd.shaafisystem.com"
      secretName: argocd-tls
  rules:
    - host: "argocd.shaafisystem.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
