# Real domain (shaafisystem.com) is now live via Cloudflare, proxied — so
# HTTP-01 (which needs direct port-80 reachability to the origin) is unreliable
# through the proxy. Using DNS-01 against Cloudflare instead: cert-manager
# creates a TXT record via the Cloudflare API, no port-80 dependency at all.
# The API token this references (cloudflare-api-token-secret, cert-manager ns)
# is applied directly to the cluster, not committed here — see gitops-only-fixes
# memory for why credentials are the one deliberate exception to "everything in git".
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ayoubdahir@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsZones:
            - "shaafisystem.com"
