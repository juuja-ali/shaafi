# No domain yet — using sslip.io like the rest of the cluster's ingress hosts
# (see argocd-ingress). Swap for a real hostname once one is pointed at the
# cluster. Auth: dedicated ServiceAccount + ClusterRoleBinding (cluster-admin,
# the chart's own default) + a non-expiring ServiceAccount-token Secret via
# extraManifests, so the login token is available declaratively rather than
# generated by hand with `kubectl create token`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    targetRevision: 0.43.0
    chart: headlamp
    helm:
      values: |
        nameOverride: headlamp
        serviceAccount:
          create: true
          name: headlamp
        clusterRoleBinding:
          create: true
          clusterRoleName: cluster-admin
        ingress:
          enabled: true
          ingressClassName: nginx
          annotations:
            nginx.ingress.kubernetes.io/ssl-redirect: "false"
          hosts:
            - host: headlamp.11-0-37-213.sslip.io
              paths:
                - path: /
                  type: Prefix
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        extraManifests:
          - |
            apiVersion: v1
            kind: Secret
            metadata:
              name: headlamp-admin-token
              namespace: headlamp
              annotations:
                kubernetes.io/service-account.name: headlamp
            type: kubernetes.io/service-account-token
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
