# Real domain (shaafisystem.com) is live as of 2026-07-08 — auto-sync enabled.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: letsencrypt-issuer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/juuja-ali/shaafi.git
    targetRevision: HEAD
    path: erpnext-gitops/system/cert-manager/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
